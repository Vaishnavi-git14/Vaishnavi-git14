<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Transaction — Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="add-wrapper">
    <div class="add-card">
        <a href="/dashboard" class="back-link">← Back to Dashboard</a>

        <h2>➕ Add Transaction</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-messages">
              {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Type Toggle: Expense / Income -->
            <div class="form-group">
                <label>Transaction Type</label>
                <div class="type-toggle">
                    <input type="radio" name="type" id="type-expense" value="Expense" checked>
                    <label for="type-expense">💸 Expense</label>

                    <input type="radio" name="type" id="type-income" value="Income">
                    <label for="type-income">💰 Income</label>
                </div>
            </div>

            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" placeholder="e.g. Grocery, Salary, Rent" required>
            </div>

            <div class="form-group">
                <label>Amount (₹)</label>
                <input type="number" step="0.01" min="0.01" name="amount" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select name="category" required>
                    <option value="" disabled selected>Select a category</option>
                    <optgroup label="Expenses">
                        <option value="Food & Dining">Food & Dining</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills & Utilities">Bills & Utilities</option>
                        <option value="Health">Health</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Education">Education</option>
                        <option value="Rent">Rent</option>
                        <option value="Other">Other</option>
                    </optgroup>
                    <optgroup label="Income">
                        <option value="Salary">Salary</option>
                        <option value="Freelance">Freelance</option>
                        <option value="Investment">Investment</option>
                        <option value="Gift">Gift</option>
                        <option value="Other Income">Other Income</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label>Date</label>
                <input type="date" name="trans_date" required>
            </div>

            <button type="submit" class="btn btn-primary">Save Transaction</button>
        </form>
    </div>
</div>
</body>
</html>
